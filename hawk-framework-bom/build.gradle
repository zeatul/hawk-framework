plugins {
    id 'buildlogic.java-platform-conventions'
}

description = 'Bill of Materials for Hawk Framework modules'

// The BOM version comes from gradle.properties (rootProject.version).
// Dynamically discover all subprojects from settings.gradle, excluding BOM projects themselves.
def hawkModules = rootProject.subprojects
    .findAll { !it.name.endsWith('-bom') }
    .collect { it.name }
    .sort()

publishing {
    publications {
        // Only the hawk-* modules published by this project.
        hawkFrameworkBom(MavenPublication) {
            artifactId = 'hawk-framework-bom'

            def constraints = hawkModules.collect { module ->
                [group: 'io.github.zeatul', artifactId: module, version: 'hawk-framework.version', versionValue: version.toString()]
            }
            def propertiesMap = ['hawk-framework.version': version.toString()]

            writeDependencyManagement(pom, [constraints: constraints, propertiesMap: propertiesMap])
        }
    }
}
